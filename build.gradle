buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'

version = "1.12.2-forge-dev"
group = "virtuoel.pehkui"
archivesBaseName = "pehkui"

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}

repositories {
    mavenCentral()
}

dependencies {
}

sourceSets {
    main {
        java.srcDirs = ['src/forge/java']
        resources.srcDirs = ['src/forge/resources']
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'virtuoel.pehkui.coremod.PehkuiLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}

processResources {
    inputs.property "version", project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
}
