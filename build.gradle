buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        // Forge 1.12.2 publishes userdev3, which requires ForgeGradle 3+.
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = "1.12.2-forge-dev"
group = "virtuoel.pehkui"
archivesBaseName = "pehkui"

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}

sourceSets {
    main {
        java.srcDirs = ['src/forge/java']
        resources.srcDirs = ['src/forge/resources']
    }
}

jar {
    manifest {
        attributes(
            'FMLCorePlugin': 'virtuoel.pehkui.coremod.PehkuiLoadingPlugin',
            'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}
