name: Forge 1.12.2 build

on:
  push:
    branches:
      - forge/1.12.2-port
  pull_request:
    branches:
      - forge/1.12.2-port
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build with ForgeGradle
        run: ./gradlew --no-daemon setupCIWorkspace build
